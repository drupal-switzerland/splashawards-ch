id: splash_ch_node_page
label: 'Pages'
migration_tags: [splash_ch]
source:
  plugin: splash_ch_legacy_entity
  entity_type: node
  bundle: page
  # Pure case listings, replaced by the award landing pages (redirected).
  exclude_ids: [193, 266]
  fields: [field_paragraphs]
process:
  nid: nid
  title: title
  uid: owner
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky
  langcode: { plugin: default_value, default_value: en }
  field_paragraphs:
    plugin: splash_ch_paragraphs
    source: field_paragraphs
  field_hero_media:
    plugin: splash_ch_media
    source: hero_fid
  path/pathauto: { plugin: default_value, default_value: 1 }
destination:
  plugin: entity:node
  default_bundle: page
migration_dependencies:
  required: [splash_ch_file, splash_ch_user]
