name: app
type: 'php:8.3'

runtime:
  extensions:
    - redis
    - apcu

build:
  flavor: composer

dependencies:
  php:
    composer/composer: '^2'

relationships:
  database: 'db:mysql'
  redis: 'cache:redis'

disk: 2048

mounts:
  '/web/sites/default/files':
    source: local
    source_path: 'files'
  '/tmp':
    source: local
    source_path: 'tmp'
  '/private':
    source: local
    source_path: 'private'
  '/.drush':
    source: local
    source_path: 'drush'
  '/drush-backups':
    source: local
    source_path: 'drush-backups'

hooks:
  build: |
    set -e
  # drush deploy = updb + cim + cr + deploy hooks. config_ignore keeps
  # system.site and the case submission settings as edited on prod.
  deploy: |
    set -e
    php ./vendor/bin/drush -y deploy

web:
  locations:
    '/':
      root: 'web'
      expires: 5m
      passthru: '/index.php'
      allow: false
      rules:
        '\.(avif|webp|jpe?g|png|gif|svgz?|css|js|map|ico|bmp|eot|woff2?|otf|ttf)$':
          allow: true
        '^/robots\.txt$':
          allow: true
        '^/sitemap\.xml$':
          allow: true
        '^/sites/sites\.php$':
          scripts: false
        '^/sites/[^/]+/settings.*?\.php$':
          scripts: false
    '/sites/default/files':
      allow: true
      expires: 5m
      passthru: '/index.php'
      root: 'web/sites/default/files'
      scripts: false
      rules:
        '^/sites/default/files/(css|js)':
          expires: 2w

crons:
  drupal:
    spec: '*/15 * * * *'
    commands:
      start: 'cd web ; ../vendor/bin/drush core:cron'
